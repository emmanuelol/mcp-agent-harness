name: CI
on: [push, pull_request]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mcp-agent-harness:test .

      - name: Run tests in container
        run: docker compose run --rm test

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mcp-agent-harness:test
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Verify no secrets in image
        run: |
          docker run --rm --entrypoint "" mcp-agent-harness:test sh -c \
            'find / -name "*.env" -o -name "sessions.json" 2>/dev/null | grep -v proc && exit 1 || exit 0'
