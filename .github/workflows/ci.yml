name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Image
        run: make build

      - name: Run Test Suite
        run: make test

      - name: Security & Leak Audit
        run: make audit

      - name: Verify Live Endpoint (Demo)
        run: make demo
