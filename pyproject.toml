[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-agent-harness"
version = "0.1.0"
description = "Generic, SRE-hardened Model Context Protocol (MCP) harness for autonomous agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.27.0",
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
data = [
    "pandas>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
